services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: prod4me-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-prod4me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-prod4me}"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: quay.io/minio/minio:latest
    container_name: prod4me-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: prod4me-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing local/${MINIO_BUCKET_AUDIO:-beat-audio};
      mc mb --ignore-existing local/${MINIO_BUCKET_ARTWORK:-beat-artwork};
      mc anonymous set download local/${MINIO_BUCKET_ARTWORK:-beat-artwork};
      echo 'MinIO initialized: buckets created, artwork public-read';
      "
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_AUDIO: ${MINIO_BUCKET_AUDIO:-beat-audio}
      MINIO_BUCKET_ARTWORK: ${MINIO_BUCKET_ARTWORK:-beat-artwork}

  # Self-hosted Rapid Email Verifier (lib/email-check.ts). Pinned by digest so
  # a new upstream image is never pulled automatically — see DEPLOY.md
  # "Email validator" to update it on purpose. Bound to 127.0.0.1 only.
  email-validator:
    image: umutert/emailvalidator@sha256:78ab88d3bb19cf3501d794522ad527a53ba77ab59b8a969f65d3ac70651181ac
    container_name: prod4me-email-validator
    environment:
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  minio-data:
  postgres-data:
